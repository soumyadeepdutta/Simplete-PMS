name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run server tests
        run: npm test
        working-directory: server

      - name: Build release
        run: npm run build:release

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./release/package.json').version")
          echo "Tag version: $TAG"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Git tag v$TAG does not match release/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./release/package.json').version")
          # Semver prereleases (contain a hyphen) publish under the `beta`
          # dist-tag so `npx simplete-pms` / `@latest` never silently install them.
          if [[ "$VERSION" == *-* ]]; then
            TAG=beta
          else
            TAG=latest
          fi
          echo "Publishing $VERSION with --tag $TAG"
          npm publish ./release --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          EXTRA_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "${EXTRA_FLAGS[@]}"
