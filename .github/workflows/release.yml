name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) — no NPM_TOKEN. Requires the package to already
    # exist on npmjs.com with a Trusted Publisher pointed at this workflow file.
    permissions:
      contents: write # gh release create
      id-token: write # npm OIDC + provenance
    steps:
      - uses: actions/checkout@v4

      # Node 22+ with npm >= 11.5.1 is required for Trusted Publishing OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run server tests
        run: npm test
        working-directory: server

      - name: Build release
        run: npm run build:release

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./release/package.json').version")
          echo "Tag version: $TAG"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Git tag v$TAG does not match release/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./release/package.json').version")
          # Semver prereleases (contain a hyphen) publish under the `beta`
          # dist-tag so `npx simplete-pms` / `@latest` never silently install them.
          if [[ "$VERSION" == *-* ]]; then
            TAG=beta
          else
            TAG=latest
          fi
          echo "Publishing $VERSION with --tag $TAG (Trusted Publishing / OIDC)"
          # No NODE_AUTH_TOKEN — npm exchanges the Actions OIDC token with the registry.
          # --provenance is automatic under Trusted Publishing; keep it explicit.
          npm publish ./release --provenance --access public --tag "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          EXTRA_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          # Idempotent: skip if this tag already has a GitHub Release (e.g. re-run).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists — skipping create"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${EXTRA_FLAGS[@]}"
          fi
