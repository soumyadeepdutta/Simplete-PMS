<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007AFF'><circle cx='12' cy='12' r='10'/><text x='12' y='16' font-size='12' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>S</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Simplete</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('simplete_color_theme') || 'icy';
          document.documentElement.setAttribute('data-color-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-color-theme', 'icy');
        }
      })();
    </script>
  </head>
  <body class="bg-page-atmosphere text-ink antialiased font-sans transition-colors duration-200 overflow-hidden select-none min-h-screen flex items-center justify-center p-0 sm:p-4 md:p-6">
    <div id="root" class="w-full h-screen sm:h-[95vh] sm:rounded-3xl shadow-window overflow-hidden bg-glass-strong border border-glass flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
